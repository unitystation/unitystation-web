on:
    pull_request:
        branches:
            - master
            - develop
jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - uses: actions/setup-node@v3
              with:
                  node-version: 22.x
            - run: npm install
            - name: oxlint
              run: npm run lint
            - name: format check
              run: npm run format:check
            - run: npm run build
    component_test:
        runs-on: ubuntu-latest
        needs: [lint]
        steps:
            - uses: actions/checkout@v3
            - uses: actions/setup-node@v3
              with:
                  node-version: 22.x
            - run: npm install
            - name: component tests
              run: npm run test:unit
    e2e_test:
        runs-on: ubuntu-latest
        needs: [lint]
        steps:
            - uses: actions/checkout@v3
            - uses: actions/setup-node@v3
              with:
                  node-version: 22.x
            - run: npm install
            - name: e2e testing
              run: npm run test:e2e
